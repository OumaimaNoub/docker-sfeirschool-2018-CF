name: CI - Build, Dockerize, Push, Release

on:
  push:
    branches: [ main, master ]

jobs:

  back:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Adapte le chemin "back" et la version de Node au contenu réel du repo
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '14'   # <-- vérifie le champ "engines" du package.json de back/
          cache: 'npm'
          cache-dependency-path: back/package-lock.json

      - name: Install & build
        working-directory: back
        run: |
          npm ci
          npm run build --if-present

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        working-directory: back
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/sfeirschool-back:${{ steps.vars.outputs.short_sha }} .

      - name: Push image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/sfeirschool-back:${{ steps.vars.outputs.short_sha }}

  front:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Adapte le chemin "front" et la version de Node au contenu réel du repo
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '14'   # <-- vérifie le champ "engines" du package.json de front/
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install & build
        working-directory: front
        run: |
          npm ci
          npm run build --if-present

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        working-directory: front
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/sfeirschool-front:${{ steps.vars.outputs.short_sha }} .

      - name: Push image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/sfeirschool-front:${{ steps.vars.outputs.short_sha }}

  release:
    needs: [ back, front ]
    runs-on: ubuntu-latest
    permissions: 
       contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.back.outputs.short_sha }}
          name: Release ${{ needs.back.outputs.short_sha }}
          body: |
            Images publiées sur Docker Hub :
            - ${{ secrets.DOCKERHUB_USERNAME }}/sfeirschool-back:${{ needs.back.outputs.short_sha }}
            - ${{ secrets.DOCKERHUB_USERNAME }}/sfeirschool-front:${{ needs.front.outputs.short_sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
